    <p>I also have not used Tailor in about a year now as we have been very happy with git (and the git-cvsserver gives us all the compatibility we need). If I ever need to move repository formats again, I may relook into the tool.</p>
    <p>Thanks for taking the time to comment on my blog! It’s really cool to know that Tailor is still making progress and trying to be even easier to use.</p>
