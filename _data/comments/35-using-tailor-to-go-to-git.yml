    <p>Nice, another revision system to learn 😛 Can’t hurt to know a couple of them. Darcs was also hurting my poor laptop, from tim to time it started to use so much swap that all started to go very slow and I had to restart the laptop. It is also nice to see that Git is so space efficient and probably it is also more supported by various web services like ohloh. All in all I think switching to Git was the right thing to do.</p>
