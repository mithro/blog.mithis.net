    <p>I’m not sure it needs explaining per se… That’s just how habitual verbs work. They get an ‘s’ with a singular subject, and no suffix with a plural subject. (In fact, it more likely drops the ‘s’ for a plural subject, but the actual difference is buried somewhere in an exercise book in my cupboard)</p>
    <p>He squeegles, she squeegles, we all squeegle for ice cream!</p>
    <p>I think the mental dissonance you’re suffering is because rock is also a noun, and you want your singular noun to not have an ‘s’ and your plural noun to have an ‘s’.</p>
    <p>(I have a vauge recollection that there’s another class of English verbs that doesn’t do this, but I can’t for the life of me remember. This vauge recollection is pointing me towards strong VS weak verbs…)</p>
