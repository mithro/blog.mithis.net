    <p>Have you found any decent manual for Eagle 4.1?</p>
    <p>There is just one hang-up I am having with it, and that is adding user-defined components to the library (device manufacturers don’t support Eagle much at all).  Their component editor is a real piece of crap, really bad!  Almost useless.  I have to follow the steps in their tutorial every time I need to add a new device, and even then I risk crapping out the whole library.</p>
    <p>Does anyone offer a “missing manual” to your knowledge?</p>
