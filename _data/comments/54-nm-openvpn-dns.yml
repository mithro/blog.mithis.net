    <p>If you’ve ever found resolv.conf to be too simplistic, check out the <a href="//tristesse.org/~joel/tmp/abortion.txt" rel="nofollow">script</a> that I once wrote. It gives you a way to set name servers and search domains based on (in my examples) the host specified in the command line or user, but could easily be made to check for the presence of a VPN. It’s delightfully evil.</p>
