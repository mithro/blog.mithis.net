- id: '7248'
  type: comment
  li_class: comment c-y2011 c-m05 c-d12 c-h05 alt c11
  author: Dorian Scholz
  date_text: May 11, 2011 at 7:21 pm
  date_title: '2007-09-06T12:39:48+1000'
  avatar: https://secure.gravatar.com/avatar/53dc25775bca05e98ad0b4dc28711191?s=32&d=mm&r=pg
  message: |-
    <p>Since this page has a high google rank for this topic, here is a more elegant solution possible from NetworkManager 0.8.1 on:</p>
    <p>There is now a command line tool nmcli which can interact with the nm-applet and NM directly.<br>
    So connecting to a VPN is as easy as this:</p>
    <p>nmcli con up id NAME_OF_THE_VPN</p>
- id: '7284'
  type: comment
  li_class: comment c-y2011 c-m12 c-d07 c-h05 c12
  author: Mahavir
  date_text: December 7, 2011 at 7:16 am
  date_title: '2007-09-06T12:39:48+1000'
  avatar: https://secure.gravatar.com/avatar/aad0d34d2753fa68c5996d2c10495540?s=32&d=mm&r=pg
  message: "<p>For stock installation of Ubuntu 10.04 (Lucid Lynx) users, Network Manager version 0.8.0, so nmcli is not available and since there may be others like me who like to stick to the LTS, here is a solution.</p>\n<p>Visit <a href=\"http://cgit.freedesktop.org/NetworkManager/NetworkManager/tree/examples/python?h=NM_0_8\" rel=\"nofollow\">http://cgit.freedesktop.org/NetworkManager/NetworkManager/tree/examples/python?h=NM_0_8</a> and download list-connections.py.  Mark it as executable and run it to find the UUID of your VPN connection.</p>\n<p>Also, download vpn.py from the same link. This script is written to connect to VPN over wifi only. So, if you want to connect to VPN over your wireless network then simply execute the script.</p>\n<p>However, for wired a minor modification in vpn.py is required .  Below is the patch for the same.</p>\n<p>*** vpn.py\t2011-12-07 02:38:06.205855632 +0530<br>\n— vpn1.py\t2011-12-07 02:39:49.861855276 +0530<br>\n***************<br>\n*** 86,92 ****<br>\n      return None</p>\n<p>! def get_wifi_device_path():<br>\n      bus = dbus.SystemBus()<br>\n      proxy = bus.get_object(‘org.freedesktop.NetworkManager’, ‘/org/freedesktop/NetworkManager’)<br>\n      iface = dbus.Interface(proxy, dbus_interface=’org.freedesktop.NetworkManager’)<br>\n— 86,92 —-<br>\n      return None</p>\n<p>! def get_device_path(reqDevType):<br>\n      bus = dbus.SystemBus()<br>\n      proxy = bus.get_object(‘org.freedesktop.NetworkManager’, ‘/org/freedesktop/NetworkManager’)<br>\n      iface = dbus.Interface(proxy, dbus_interface=’org.freedesktop.NetworkManager’)<br>\n***************<br>\n*** 95,101 ****<br>\n          proxy = bus.get_object(‘org.freedesktop.NetworkManager’, d)<br>\n          iface = dbus.Interface(proxy, dbus_interface=’org.freedesktop.DBus.Properties’)<br>\n          devtype = iface.Get(‘org.freedesktop.NetworkManager.Device’, ‘DeviceType’)<br>\n!         if devtype == 2:<br>\n              return d<br>\n      return None</p>\n<p>— 95,101 —-<br>\n          proxy = bus.get_object(‘org.freedesktop.NetworkManager’, d)<br>\n          iface = dbus.Interface(proxy, dbus_interface=’org.freedesktop.DBus.Properties’)<br>\n          devtype = iface.Get(‘org.freedesktop.NetworkManager.Device’, ‘DeviceType’)<br>\n!         if devtype == reqDevType:<br>\n              return d<br>\n      return None</p>\n<p>***************<br>\n*** 135,143 ****<br>\n      print “couldn’t find the connection”<br>\n      sys.exit(1)</p>\n<p>! device_path = get_wifi_device_path()<br>\n  if not device_path:<br>\n!     print “no wifi device found”<br>\n      sys.exit(1)</p>\n<p>  # Is it already activated?<br>\n— 135,143 —-<br>\n      print “couldn’t find the connection”<br>\n      sys.exit(1)</p>\n<p>! device_path = get_device_path(1) #Pass 2 for wifi<br>\n  if not device_path:<br>\n!     print “no wired device found”<br>\n      sys.exit(1)</p>\n<p>  # Is it already activated?</p>"
