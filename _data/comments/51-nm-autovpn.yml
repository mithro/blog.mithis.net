  avatar: https://secure.gravatar.com/avatar/868991d5147b3e1e124dd8b5de07fcba?s=32&d=mm&r=pg
  message: |-
    <p>I have tried the script as Robin did and I get the exact same result.</p>
    <p>(To help Robin out: you can restart nm-applet by restarting NetworkManager and NetworkManagerDispatcher sevices if those should have bailed out as well (happende to me once while testing), in a terminal type:<br>
    <code><br>
    ps -A |grep -i Network<br>
    # With the pid numbers you can now do:<br>
    sudo kill #PIDNRS<br>
    </code><br>
    Do the same for nm-applet (grep -i nm)<br>
    Then restart NetworkManager and NetworkManagerDispatcher as root and start nm-applet using ctrl+F2)</p>
    <p>I have taken a look at the source code of the networkmanager vpn dbus interface and I could not find any error’s in the code you used (then again, this was my first time I took a look at a phython script :p )</p>
    <p>However we should get an output from the nm-applet (when running inside the console) saying it is connection to the VPN. (Don’t know the exact message, but run nm-applet inside the terminal and break the VPN cpnnection and set it up again, you’ll see what I mean)</p>
    <p>I believe the script works for you Mithro? Are you running it as root, have got anything special configured? (eg inside your keyring) Anyhting that might explain the script to fail us?</p>
    <p>I have been trying to autoconnect my vpn for a long time and basicly gave up because I didn’t feel like ‘hacking’ a script together, but this is reeeaaal close to a solution…</p>
    <p>I hope I’ll hearing from you,<br>
    Mathijs</p>
