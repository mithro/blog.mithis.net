    <p>Actually I hope diplomacy is never forced.   Deception, breaking of agreements – the backstab – is part of the game.  </p>
    <p>One thing to remember – if someone backstabs you, there trustworthiness in later games is reduced – so there are long term consequences – but it should be there as an option.</p>
