    <p>Great to see this charter, any estimates about when each version will be released?</p>
    <p>Is there a typo in second point for TP03, where you are mentioning TP04?</p>
    <p>Oh and about diplomacy. You say that if a player says she will not attack another one server will prevent this happening. Will this also be managed by each game separately? Because this can be a tactical trick, you say you will not attack and ten attack anyways the unprepared victim.<br>
    Maybe this could be a setting in each game so that you can force game to be fair or not force that.</p>
