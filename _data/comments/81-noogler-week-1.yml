    <p>Oooh, I’m so jealous. I always love to hear anything about the internal goings on of google. Its neat to hear that not only do they just provide free food but other, more job-relevant perks, like open access and great tech support. </p>
    <p>I can also feel for you with the jetlag. Yours may be a bit more extreme though, nothing like forcing yourself to stay up for days on end just to adjust. Please do blog more about what happens in and around the googleplex, I’d be interested to hear anything you are allowed to say to outsiders.</p>
