# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Mithro rants about stuff
email: tim@mithis.net
description: >- # this means to ignore newlines until "baseurl:"
  Technical blog about open source hardware, software development, and tech projects.
  Documenting work on HDMI2USB, TimVideos.us, and various hardware/software initiatives.
baseurl: "/blog.mithis.net" # github.io project subpath (staging). Set to "" for the blog.mithis.net custom-domain cutover.
url: "https://mithro.github.io" # staging origin. Set to https://blog.mithis.net for the custom-domain cutover.
github_username: mithro

# Build settings
# theme: minima  # Removed for now - will use custom Barthelme theme
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from

# Permalink structure - individual permalinks set in each post front matter
# permalink: /:year/:month/:title/  # Disabled - using WordPress-compatible permalinks

# Timezone — match live blog.mithis.net WP timezone (+10:00, AEST/AEDT no DST = Brisbane)
timezone: Australia/Brisbane

# Google Analytics
google_analytics: UA-XXXXXXXX-X  # Replace with actual tracking ID

# Pagination
paginate: 10

# Feed configuration
feed:
  path: "/feed/index.xml"

# Markdown processor
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  parse_block_html: true
  parse_span_html: true

# Exclude from processing.
# NOTE: An explicit exclude: list REPLACES Jekyll's internal defaults entirely
# (Jekyll 4 does not merge them). Dotfiles (.jekyll-cache, .sass-cache) are
# skipped by Jekyll regardless. Excluded items can be re-included by listing
# them under an `include:` key.
exclude:
  - scripts/
  - tests/
  - tmp/
  - docs/
  - exports/
  - theme_analysis/
  - .github/
  - vendor/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - pyproject.toml
  - uv.lock
  - setup-tools.sh
  - test_migration.sh
  - debug_posts.py
  - CLAUDE.md
  - MIGRATION_PLAN.md
  - MIGRATION_TODO.md
  - BARTHELME_SOURCE_ANALYSIS.md
  - BARTHELME_THEME_ANALYSIS.md
  - URL_STRUCTURE_COMPARISON.md
  - URL_VERIFICATION_REPORT.md
  - WORDPRESS_EXPORT_STRATEGY.md
  - migration_status.json
  - all_post_urls.json
  - checkpoint_10.json
  - checkpoint_20.json
  - checkpoint_30.json
  - checkpoint_40.json
  - checkpoint_50.json
  - xml/
  - sitemap_index.xml
